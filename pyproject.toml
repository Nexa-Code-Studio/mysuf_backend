[project]
name = "mysuf_backend"
version = "0.1.0"
description = "FastAPI backend modular monolith"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.25",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.1",
    "email-validator>=2.1.0",
    "bcrypt>=4.1.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.6",
    "httpx>=0.26.0",
    "firebase-admin>=6.5.0",
    "uuid7>=0.1.0",
    "minio>=7.2.7",
    "rapidfuzz>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
]
identity = [
    "opencv-python-headless>=4.10.0",
    "Pillow>=10.0.0",
    "numpy>=1.26.0",
    "paddleocr>=2.8.1",
    "paddlepaddle>=3.0.0",
    "insightface>=0.7.3",
    "onnxruntime>=1.19.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
